[project]
name = "atelier"
version = "0.1.0"
description = "A deterministic media engine with an AI director on top"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=1.0,<2",
    "django>=5.2,<7",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.4,<2",
    "fonttools>=4.50,<5",
    "lxml>=6.1,<7",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pikepdf>=10.13,<11",
    "pillow>=11.3,<13",
    "pillow-heif>=0.18",
    "pydantic>=2.9,<3",
    "pypdf>=6.19,<7",
    "pypdfium2>=5.13,<6",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]  # the S3 backend of the content-addressed store
ml = [
    "onnxruntime>=1.20",
    "faster-whisper>=1.1",
    "opencv-contrib-python-headless>=4.10",
]  # the ML plugins (docs/08 Phase 6)
# Multi-provider agent (docs/04): Anthropic is a hard dependency (the default, first-class
# provider); these two cover everyone else. `openai` also covers Ollama and any other
# OpenAI-compatible server — they're reached through the same `openai` client, pointed at a
# different `base_url`.
openai = ["openai>=1.50,<4"]
gemini = ["google-genai>=1.0,<3"]

[project.scripts]
atelier = "atelier.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.43.103",
    "django-stubs>=6.1.1",
    "google-genai>=1.0,<3",
    "hypothesis>=6.100",
    "lxml-stubs>=0.5.1",
    "moto[s3]>=5",
    "mypy>=1.11",
    "numpy>=2.0",
    "openai>=1.50,<4",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.6",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
DJANGO_SETTINGS_MODULE = "atelier.api.test_settings"
addopts = "-ra"
markers = [
    "slow: long-running (the 500-image determinism batch)",
    "live: calls the real Anthropic API and spends tokens (needs ATELIER_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Summaries deliberately use typographic characters (→ · … –).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "atelier.api.test_settings"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "fontTools", "fontTools.*", "boto3", "boto3.*", "moto", "moto.*", "onnxruntime", "onnxruntime.*", "faster_whisper", "faster_whisper.*", "cv2", "cv2.*", "openai", "openai.*", "google", "google.genai", "google.genai.*"]
ignore_missing_imports = true  # no py.typed marker

[tool.ruff.lint.per-file-ignores]
"src/atelier/api/**" = ["RUF012"]  # Django model Meta and admin attributes are class-level lists

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as defaults.
extend-immutable-calls = [
    "atelier.agent.budget.BudgetLimits",
    "atelier.engine.runner.RunLimits",
    "atelier.spec.validate.SpecLimits",
]
